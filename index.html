<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duo - 200 Dias</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #313338;
      color: #dbdee1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Container do Discord */
    .discord-container {
      width: 100%;
      max-width: 600px;
      height: 90vh;
      background-color: #2b2d31;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .discord-header {
      background-color: #313338;
      padding: 16px;
      border-bottom: 2px solid #1e1f22;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      color: #f2f3f5;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background-color: #23a55a;
      border-radius: 50%;
    }

    .chat-area {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: fadeIn 0.3s ease;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #5865f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      flex-shrink: 0;
    }

    .msg-content {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .username {
      font-size: 0.9rem;
      font-weight: bold;
      color: #f2f3f5;
      margin-bottom: 4px;
    }

    .text {
      font-size: 0.95rem;
      line-height: 1.4;
      color: #dbdee1;
      background-color: #383a40;
      padding: 8px 12px;
      border-radius: 8px;
      width: fit-content; /* Garante que mensagens curtas fiquem em 1 linha */
      max-width: 85%;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .typing-indicator {
      font-size: 0.85rem;
      color: #949ba4;
      font-style: italic;
      margin-top: 4px;
      display: none;
      padding: 0 20px 8px 20px;
    }

    .input-area {
      padding: 16px;
      background-color: #313338;
      display: flex;
      gap: 10px;
    }

    .input-area input {
      flex: 1;
      background-color: #383a40;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      color: #f2f3f5;
      outline: none;
    }

    .input-area button {
      background-color: #5865f2;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .input-area button:hover {
      background-color: #4752c4;
    }

    /* Aviso do F12 */
    .f12-notice {
      display: none;
      margin: 16px auto;
      padding: 12px 20px;
      background-color: #5865f2;
      color: white;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      text-align: center;
      animation: pop 0.4s ease;
      box-shadow: 0 4px 12px rgba(88, 101, 242, 0.4);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pop {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- TELA DO DISCORD -->
  <div class="discord-container" id="discordContainer">
    <div class="discord-header">
      <div class="status-dot"></div>
      <span>Chat do Duo - 200 Dias</span>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="message">
        <div class="avatar" style="background-color: #2b2d31; border: 1px solid #5865f2;">🤖</div>
        <div class="msg-content">
          <span class="username" style="color: #5865f2;">Sistema Duo</span>
          <span class="text">Digite "Oi" para começar a conversa...</span>
        </div>
      </div>
    </div>

    <div class="typing-indicator" id="typing">Seu Duo está digitando...</div>

    <div class="input-area" id="inputArea">
      <input type="text" id="userInput" placeholder="Digite 'Oi' aqui..." />
      <button id="sendBtn">Enviar</button>
    </div>

    <div class="f12-notice" id="f12Notice">
      💻 Pressione F12 (e abra a aba Console) para a próxima parte! ✨
    </div>
  </div>

  <script>
    const chatArea = document.getElementById('chatArea');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const typing = document.getElementById('typing');
    const inputArea = document.getElementById('inputArea');
    const f12Notice = document.getElementById('f12Notice');

    const cartaMensagens = [
      "Oiii duooo… (ia falar Oii melhorzona do mundo kkkk mas vai q fica chato ne) 😂",
      "200 dias nao sao 200 horas kkkkk sao 200 dias que a gente é amigo né? afinal minha melhor amiga ta aqui…",
      "looogico que nesses 200 dias ce ja se estressou comigoo… ja ficou feliz com eu… ja ficou triste com euu… mas acho que voce gosta de mim e me perdoou por tudo kkkk…",
      "hoje mais que nunca é especial pra mim, 200 dias com tuuuuu! ainda lembro que ce recusou aquele card de dia do duo hein kkkk o proximo vamo pegar!",
      "mas essa cartinha duo é so pra dizer que tu sempre vai ser a melhor do mundo ta? Serio duoo, ninguem NINGUEM no mundo tira esse titulo de voce! ✨",
      "eu ate hoje agradeço po no dia 23 de março de me chamar de duo kkkkkk imagina se fosse outro :( ainda bem que fui o sortudo que voce chamou kkkkk",
      "e agora todo dia eu penso “meu Deusss como que eu pss ter a melhor duo desse mundo cara”",
      "eu erro? sim! estresso vc? sim! as vezes sou reclamao e vc odeia? sim! mas ce sabe que no fundo do meu coracao gosto de tuuu ❤️",
      "valeu duozonaaaa! 🚀✨"
    ];

    let step = 0;

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage('DUO', text, '#eb459e');
      userInput.value = '';
      inputArea.style.display = 'none';

      setTimeout(sendNextDuoMessage, 1500);
    }

    function appendMessage(author, text, color) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message';
      msgDiv.innerHTML = `
        <div class="avatar" style="background-color: ${color}">${author[0]}</div>
        <div class="msg-content">
          <span class="username" style="color: ${color}">${author}</span>
          <span class="text">${text}</span>
        </div>
      `;
      chatArea.appendChild(msgDiv);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function sendNextDuoMessage() {
      if (step < cartaMensagens.length) {
        typing.style.display = 'block';
        chatArea.scrollTop = chatArea.scrollHeight;

        setTimeout(() => {
          typing.style.display = 'none';
          appendMessage('Seu Duo', cartaMensagens[step], '#5865f2');
          step++;
          setTimeout(sendNextDuoMessage, 3500);
        }, 2200);
      } else {
        f12Notice.style.display = 'block';
        chatArea.scrollTop = chatArea.scrollHeight;
        setupConsoleSecret();
      }
    }

    function setupConsoleSecret() {
      const heartAscii = `
  ******       ******
 **      **   **      **
**        ** **        **
**         ***         **
 **                   **
   **               **
     **           **
       **       **
         **   **
           ***
            *
      `;

      console.log('%c' + heartAscii, 'color: #ff4b72; font-weight: bold;');
      console.log('%c❤️ 200 DIAS DE DUO! PERFEITO DEMAIS! ❤️', 'color: #ff4b72; font-size: 16px; font-weight: bold; background: #1e1f22; padding: 8px 12px; border-radius: 6px;');
      console.log('%cObrigado por ser a melhor duo do mundo! ✨', 'color: #5865f2; font-size: 14px; font-weight: bold;');
    }
  </script>
</body>
</html>
